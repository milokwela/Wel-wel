<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>POLINA beta 1.2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#09090b;--pk:#ff4fa3;--pk2:#ff9ccc;--s1:#17141a;--s2:#241c28;--pc:#5a1840;--opc:#ffd9ea;--t:#f6eef2;--t2:#b9a9b3;font-family:Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}*:not(input){-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);overscroll-behavior:none;touch-action:manipulation}
button,input{font-family:inherit}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;z-index:5;display:flex;overflow:auto;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) 16px 14px;background:#09090b;isolation:isolate}
.ov::before,.ov::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(80px);animation:drift 14s ease-in-out infinite alternate}
.ov::before{width:340px;height:340px;background:#ff4fa3;opacity:.32;left:-120px;top:-90px}
.ov::after{width:380px;height:380px;background:#b3124f;opacity:.38;right:-150px;bottom:-130px;animation-duration:19s}
@keyframes drift{to{transform:translate(90px,70px) scale(1.25)}}
.ov.dim{background:#09090bdd}.ov.dim::before,.ov.dim::after{display:none}
.hide{display:none!important}
.card{margin:auto;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(56px,18vw,80px);font-weight:900;letter-spacing:.12em;text-indent:.12em;text-align:center;line-height:1;color:#fff;text-shadow:0 0 10px #ff4fa3,0 0 34px #ff4fa3,0 0 70px #ff4fa388;animation:neon 3.5s ease-in-out infinite}
@keyframes neon{50%{text-shadow:0 0 6px #ff4fa3,0 0 20px #ff4fa3,0 0 44px #ff4fa366}}
.beta{align-self:center;margin-top:-6px;padding:3px 12px;border-radius:12px;background:#fff;color:#09090b;font-weight:700;font-size:12px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 18px #ff4fa3}}
h2{margin:0;font-size:26px;text-align:center}
.sf{background:linear-gradient(160deg,#1c1422cc,#0f0b13cc);border:1px solid #ff4fa328;border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px)}
.lbl{font-size:13px;color:var(--t2);font-weight:500}
#pv{width:100%;height:auto;display:block}
input[type=text]{width:100%;height:56px;border:0;border-bottom:2px solid var(--pk);border-radius:16px 16px 0 0;background:var(--s2);color:var(--t);font-size:18px;font-weight:500;padding:0 16px;outline:0;-webkit-user-select:text;user-select:text}
.btn{height:56px;border:0;border-radius:28px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s;width:100%}
.btn:active{transform:scale(.95)}
.fill{background:linear-gradient(90deg,#ff4fa3,#ff9ccc,#ff4fa3);background-size:200%;color:#2b0518;animation:shine2 3s linear infinite;box-shadow:0 6px 28px #ff4fa355}
@keyframes shine2{to{background-position:-200% 0}}
.tonal{background:var(--pc);color:var(--opc)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.skins{display:flex;gap:10px;overflow-x:auto;padding:4px 2px;touch-action:pan-x}
.sk{width:46px;height:46px;border-radius:50%;flex:none;border:3px solid transparent;display:grid;place-items:center;font-weight:700;color:#fff}
.sk.on{border-color:#fff;box-shadow:inset 0 0 0 3px var(--s1),0 0 14px #ff4fa388}
.cols{display:flex;gap:12px;align-items:center}
