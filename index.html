<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts 💗 beta 1.3</title>
<style>
:root{--surf:rgba(14,14,14,.74);--surf2:rgba(26,26,26,.8);--pri:#ff80ab;--onpri:#3a0018;--txt:#f5f5f5;--cv:rgba(0,0,0,.65);--c:#ff80ab;--n1:#ff80ab;--n2:#fff;--st:#fff;--bd:rgba(255,255,255,.16);--tn:rgba(255,255,255,.09);--lt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--surf:rgba(255,255,255,.72);--surf2:rgba(255,224,236,.8);--pri:#c2185b;--onpri:#fff;--txt:#2b0a18;--cv:rgba(255,255,255,.8);--n1:#c2185b;--n2:#1a0710;--st:#e91e63;--bd:rgba(194,24,91,.2);--tn:rgba(194,24,91,.1);--lt:#c2185b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--txt);font-family:Roboto,"Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;background:linear-gradient(120deg,#000,#0f0f0f,#cfcfcf,#1a1a1a,#000);background-size:500% 500%;animation:bg 24s ease infinite}
:root[data-theme="light"] body{background:linear-gradient(120deg,#fff,#ffe0ec,#ff8fb8,#fff,#ffc2d9,#fff);background-size:500% 500%}
body.broken{overflow:hidden;height:100vh}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#stars,#bgl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--st);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}
#bgl span{position:absolute;font-weight:800;color:var(--lt);opacity:.1;transform-origin:50% 100%;animation:jump 3s ease-in-out infinite,fi .9s both}
@keyframes fi{from{opacity:0}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(var(--r)) scale(1,1)}35%{transform:translateY(-70px) rotate(calc(var(--r) + 12deg)) scale(.92,1.1)}50%{transform:translateY(-70px) rotate(calc(var(--r) + 12deg))}62%{transform:translateY(0) rotate(var(--r)) scale(1.15,.82)}}
#glow{position:fixed;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none;transform:translate(-50%,-50%);left:50%;top:30%;z-index:1}
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:18px 14px 50px;display:grid;gap:16px}
.view{display:none;gap:16px}.view.on{display:grid}
.card{background:var(--surf);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:32px;padding:22px;border:1px solid var(--bd);animation:in .7s both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.97)}}
.broken .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;border-color:transparent;animation:none}
.broken .sc{overflow:visible}
.hero{text-align:center;padding:24px 14px 18px;background:var(--surf2)}
.vr{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chip,.ver{display:inline-block;background:var(--tn);color:var(--pri);border-radius:12px;padding:6px 14px;font-size:14px;font-weight:500}
.ver{background:var(--pri);color:var(--onpri);font-weight:700;letter-spacing:.5px;box-shadow:0 0 18px -2px var(--pri)}
.soon{font-size:13px;font-weight:600;background:linear-gradient(90deg,var(--txt),var(--pri),var(--txt));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.5s linear infinite}
h1{font-size:clamp(46px,14vw,92px);margin:8px 0 4px;line-height:1.05;letter-spacing:-2px;white-space:nowrap}
body.ingame h1{font-size:clamp(32px,9vw,54px);margin:0}
body.ingame .mo{display:none}
h1 span{display:inline-block;background:linear-gradient(90deg,var(--n1),var(--n2),var(--n1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite,wave 2.4s ease-in-out infinite;transition:transform .15s}
h1 span:hover{transform:translateY(-16px) rotate(-8deg) scale(1.2)}
@keyframes sh{to{background-position:-200% 0}}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -6px}}
.sub{opacity:.85;margin:0;min-height:1.3em}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ib{background:var(--tn);color:var(--txt);border:1px solid var(--bd);border-radius:16px;padding:11px 16px;font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.ib:hover{background:var(--pri);color:var(--onpri);border-radius:24px;transform:translateY(-2px)}
.car{position:relative;padding:10px 6px}
.sc{--cw:250px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:28px calc(50% - var(--cw)/2) 30px;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.ch{position:relative;overflow:hidden;flex:0 0 var(--cw);scroll-snap-align:center;border:2px solid var(--bd);background:var(--surf2);border-radius:34px;padding:26px 14px 22px;color:inherit;font:inherit;cursor:pointer;text-align:center;scale:.8;opacity:.5;transition:scale .5s cubic-bezier(.2,.9,.3,1.3),opacity .35s,box-shadow .35s,border-color .35s,transform .15s}
.ch.on{scale:1;opacity:1;border-color:var(--k);box-shadow:0 0 40px -8px var(--k),0 18px 30px -16px #000}
.ch::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.ch:hover::after{opacity:1}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;background:radial-gradient(circle at 30% 30%,#fffa,var(--k));box-shadow:0 0 26px var(--k),inset 0 -8px 16px rgba(0,0,0,.25);animation:pu 2.5s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.07)}}
.ch:hover .av{animation:flip .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.25)}100%{transform:rotateY(360deg) scale(1)}}
.ch b{display:block;font-size:24px}.ch small{display:block;opacity:.9;font-size:13px;margin:8px 0 12px;line-height:1.35;min-height:2.7em}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.tags span{background:var(--tn);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:600}
.sp{position:absolute;left:var(--x);bottom:16px;opacity:0;color:var(--k);font-style:normal;pointer-events:none}.sp::before{content:'✦'}
.ch:hover .sp{animation:rise 1.3s ease-out infinite var(--d)}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-190px) scale(1.4) rotate(120deg)}}
.ar{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);color:var(--txt);font-size:20px;cursor:pointer;z-index:2;transition:.2s}
.ar:hover{background:var(--pri);color:var(--onpri);scale:1.12}.ar.l{left:4px}.ar.r{right:4px}
.play{width:100%;font-size:24px;padding:20px;animation:glw 2s ease-in-out infinite}
@keyframes glw{50%{box-shadow:0 0 34px 2px var(--pri)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--tn);border-radius:20px;padding:8px 14px;font-weight:500}.stat b{color:var(--pri)}
canvas{width:100%;height:auto;aspect-ratio:4/3;background:var(--cv);border-radius:24px;display:block;touch-action:none;cursor:none;border:1px solid var(--bd)}
.ctl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:100px;padding:14px 26px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s,border-radius .2s;position:relative;overflow:hidden}
.btn:hover{border-radius:16px;transform:scale(1.04)}.btn:active{transform:scale(.96)}
#ab{flex:1;min-width:170px}#ab i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.4);width:0}#ab span{position:relative}
.btn.t{background:var(--tn);color:var(--txt)}
.hint{font-size:13px;opacity:.75;margin:10px 0 0}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.dlg{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--surf2);color:var(--txt);border:1px solid var(--bd);border-radius:36px;padding:26px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transform:translateY(40px) scale(.9);transition:transform .45s cubic-bezier(.2,.9,.3,1.25)}
:root[data-theme="light"] .dlg{background:#fff0f6}
.ov.show .dlg{transform:none}
.dlg h2{margin:0 0 6px;font-size:26px;color:var(--pri)}.dlg p{margin:0 0 14px;opacity:.85}
.big{font-size:56px;font-weight:700;color:var(--pri);line-height:1;margin:6px 0 14px}
input[type=text]{width:100%;background:var(--tn);border:2px solid var(--bd);border-radius:18px;padding:14px 16px;color:var(--txt);font:inherit;font-size:16px;outline:0;transition:.2s}
input[type=text]:focus{border-color:var(--pri)}input[type=range]{width:100%;accent-color:var(--pri)}
.set{margin-bottom:16px}.set label{display:flex;justify-content:space-between;font-weight:500;margin-bottom:6px}
.lb{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}.lb td{padding:9px 8px;border-top:1px solid var(--bd)}
.lb tr{animation:row .5s both}@keyframes row{from{opacity:0;transform:translateX(-24px)}}
.lb td:first-child{width:40px;font-weight:700}.lb td:last-child{text-align:right;font-weight:700;color:var(--pri)}.lb tr.me{background:var(--tn)}
.lb tr:nth-child(1) td:first-child::after{content:'🥇'}.lb tr:nth-child(2) td:first-child::after{content:'🥈'}.lb tr:nth-child(3) td:first-child::after{content:'🥉'}.lb tr:nth-child(n+4) td:first-child::after{content:attr(data-n)}
.empty{opacity:.6;text-align:center;padding:14px}
.who{text-align:center}.who .av{width:96px;height:96px;font-size:44px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btns .btn{flex:1;padding:12px 16px}
#fix{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;z-index:100;display:none;padding:8px 16px;font-size:14px}
body.sec #fix{display:block}
body.shake main{animation:shk .1s infinite}
@keyframes shk{0%{translate:-3px 2px}50%{translate:3px -2px}100%{translate:-2px -3px}}
.fl{position:fixed;left:0;top:0;z-index:12;background:var(--pri);color:var(--onpri);font-weight:800;font-size:22px;padding:10px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:grab;touch-action:none}
@media(max-width:420px){.sc{--cw:225px}.av{width:88px;height:88px;font-size:40px}}
</style>
</head>
<body>
<div id="stars"></div><div id="bgl"></div><div id="glow"></div>
<button class="btn" id="fix" data-i="fix"></button>
<main>
  <header class="card hero">
    <div class="vr mo"><span class="ver" data-i="ver"></span><span class="soon" data-i="soon"></span></div>
    <span class="chip mo" data-i="pick"></span>
    <h1 id="name"></h1>
    <p class="sub mo" id="desc"></p>
  </header>

  <section class="view on" id="menu">
    <div class="card car">
      <button class="ar l" id="pl">‹</button><button class="ar r" id="pr">›</button>
      <div class="sc" id="chars"></div>
    </div>
    <button class="btn play" id="play" data-i="play"></button>
    <div class="bar">
      <button class="ib" data-o="set" data-i="set"></button>
      <button class="ib" data-o="lbm" data-i="lbb"></button>
      <button class="ib" id="th" data-i="th"></button>
      <button class="ib" id="lg" data-i="lg"></button>
      <button class="ib" data-o="cr" data-i="cr"></button>
    </div>
  </section>

  <section class="view" id="game">
    <div class="card">
      <div class="row"><button class="ib" id="back" data-i="back"></button><div class="stat"><span data-i="score"></span> <b id="sc">0</b></div><div class="stat"><span data-i="rec"></span> <b id="best">0</b></div><div class="stat" id="lv">❤❤❤</div></div>
      <canvas id="c" width="640" height="480"></canvas>
      <div class="ctl"><button class="btn t" id="go" data-i="restart"></button><button class="btn" id="ab"><i id="abf"></i><span id="abt"></span></button></div>
      <p class="hint" data-i="hint"></p>
    </div>
  </section>
</main>

<div class="ov" id="over"><div class="dlg">
  <h2 data-i="ot"></h2><p data-i="os"></p><div class="big" id="fs">0</div>
  <input type="text" id="nick" maxlength="14" data-p="nick" autocomplete="off">
  <div class="btns"><button class="btn" id="save" data-i="save"></button><button class="btn t" id="again" data-i="again"></button><button class="btn t" id="tomenu" data-i="tomenu"></button></div>
  <table class="lb" id="lb2"></table>
</div></div>
<div class="ov" id="lbm"><div class="dlg"><h2 data-i="lt"></h2><p data-i="ls"></p><table class="lb" id="lb1"></table><div class="btns"><button class="btn t" data-x data-i="close"></button></div></div></div>
<div class="ov" id="set"><div class="dlg"><h2 data-i="st"></h2><p data-i="ss"></p>
  <div class="set"><label><span data-i="m1"></span><span id="v1"></span></label><input type="range" id="s1" min="1" max="10" step="1"></div>
  <div class="set"><label><span data-i="m2"></span><span id="v2"></span></label><input type="range" id="s2" min="0.8" max="2.5" step="0.1"></div>
  <div class="btns"><button class="btn" data-x data-i="done"></button></div></div></div>
<div class="ov" id="cr"><div class="dlg who"><div class="av" style="--k:#ff80ab">М</div><h2 data-i="crt"></h2><p data-i="crr"></p><p data-i="crx"></p><p><b>beta 1.3</b> · <span data-i="soon"></span></p><div class="btns"><button class="btn" data-x data-i="ok"></button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const T={
ru:{ver:'beta 1.3',soon:'1.4 — уже скоро…',pick:'✨ выбери героя',play:'▶ Играть',restart:'↻ Заново',back:'← Меню',set:'⚙ Настройки',lbb:'🏆 Лидеры',cr:'💗 Создатель',th:'🌗 Тема',lg:'🌐 English',score:'Счёт',rec:'Рекорд',hint:'Мышь/палец — двигать. Способность: кнопка, пробел или правый клик.',ot:'Игра окончена 💔',os:'Придумай ник и попади в таблицу лидеров',nick:'Твой ник',save:'Сохранить',again:'Ещё раз',tomenu:'В меню',lt:'🏆 Таблица лидеров',ls:'Топ-10 игроков',close:'Закрыть',st:'⚙ Настройки',ss:'Подстрой игру под себя',m1:'Скорость мыши',m2:'Скорость игры',done:'Готово',crt:'Милок',crr:'Создатель игры',crx:'Сделано с 💗 — чёрный, белый и розовый.',ok:'Круто!',fix:'↩ вернуть',empty:'Пока пусто — стань первым!',anon:'Аноним',ready:'готово',s:'с',end:'Конец! Счёт: ',act:'Активная',pas:'Пассивная'},
en:{ver:'beta 1.3',soon:'1.4 — coming soon…',pick:'✨ choose your hero',play:'▶ Play',restart:'↻ Restart',back:'← Menu',set:'⚙ Settings',lbb:'🏆 Leaders',cr:'💗 Creator',th:'🌗 Theme',lg:'🌐 Русский',score:'Score',rec:'Best',hint:'Mouse/finger to move. Ability: button, space or right click.',ot:'Game over 💔',os:'Pick a nickname and join the leaderboard',nick:'Your nickname',save:'Save',again:'Play again',tomenu:'Menu',lt:'🏆 Leaderboard',ls:'Top 10 players',close:'Close',st:'⚙ Settings',ss:'Tune the game to your taste',m1:'Mouse speed',m2:'Game speed',done:'Done',crt:'Milok',crr:'Game creator',crx:'Made with 💗 — black, white and pink.',ok:'Cool!',fix:'↩ restore',empty:'Nothing yet — be the first!',anon:'Anon',ready:'ready',s:'s',end:'Game over! Score: ',act:'Active',pas:'Passive'}};
const CH={
 polina:{c:'#ff80ab',cd:14,dur:6,t:'a',ru:{n:'Полина',d:'Щит 6 сек · перезарядка 14 сек',ab:'🛡 Щит'},en:{n:'Polina',d:'Shield 6s · cooldown 14s',ab:'🛡 Shield'}},
 igor:{c:'#e8e8f0',cd:14,dur:7,t:'a',ru:{n:'Игорь',d:'Замедление 7 сек · перезарядка 14 сек',ab:'⏳ Замедление'},en:{n:'Igor',d:'Slow-mo 7s · cooldown 14s',ab:'⏳ Slow-mo'}},
 lena:{c:'#ff3d71',cd:0,dur:0,t:'p',ru:{n:'Лена',d:'+1 сердце каждые 20 очков',ab:'💖 Пассивка: +❤ / 20'},en:{n:'Lena',d:'+1 heart every 20 points',ab:'💖 Passive: +❤ / 20'}},
 alina:{c:'#ffc857',cd:9,dur:10,after:1,t:'a',ru:{n:'Алина',d:'Пистолет 10 сек: убивает пилы · перезарядка 9 сек',ab:'🔫 Пистолет'},en:{n:'Alina',d:'Pistol 10s: kills saws · cooldown 9s',ab:'🔫 Pistol'}}
};
const LS={g(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LG=LS.g('lg','ru'),cur='polina',ms=LS.g('ms',6),gsp=LS.g('gs',1.4),best=LS.g('pbest3',0);
const tx=k=>T[LG][k];
for(let i=0;i<40;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;$('stars').appendChild(s)}
addEventListener('pointermove',e=>{$('glow').style.left=e.clientX+'px';$('glow').style.top=e.clientY+'px'});
$('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
$('lg').onclick=()=>{LG=LG==='ru'?'en':'ru';LS.s('lg',LG);applyLang()};
// views
function view(v){$('menu').classList.toggle('on',v==='menu');$('game').classList.toggle('on',v==='game');document.body.classList.toggle('ingame',v==='game');scrollTo(0,0);if(v==='menu')centerCur('instant')}
function centerCur(b){const c=cards()[Object.keys(CH).indexOf(cur)];if(c)c.scrollIntoView({inline:'center',block:'nearest',behavior:b})}
// bg letters
function bgLetters(){const L=$('bgl');L.innerHTML='';const s=[...CH[cur][LG].n];for(let i=0;i<16;i++){const e=document.createElement('span');e.textContent=s[i%s.length];e.style.cssText=`left:${Math.random()*92}%;top:${Math.random()*80}%;font-size:${70+Math.random()*100}px;--r:${(Math.random()*40-20)|0}deg;animation-delay:${-Math.random()*4}s,0s;animation-duration:${2.2+Math.random()*2.2}s,.9s`;L.appendChild(e)}}
// name + secret
let tap=0,tapT;
function lastTap(){tap++;clearTimeout(tapT);tapT=setTimeout(()=>tap=0,1500);if(tap>=3){tap=0;secret()}}
function setName(s){const h=$('name');h.innerHTML='';[...s].forEach((ch,i)=>{const e=document.createElement('span');e.textContent=ch;e.style.animationDelay='0s,'+(i*.15)+'s';if(i===s.length-1)e.onclick=lastTap;h.appendChild(e)})}
// carousel
const sc=$('chars');let tm;
const cards=()=>[...sc.children];
function renderCards(){sc.innerHTML='';Object.entries(CH).forEach(([k,o])=>{const b=document.createElement('button'),L=o[LG];b.className='ch'+(k===cur?' on':'');b.dataset.k=k;b.style.setProperty('--k',o.c);
 let sp='';for(let i=0;i<6;i++)sp+=`<i class="sp" style="--x:${10+i*15}%;--d:${i*.18}s"></i>`;
 b.innerHTML=`${sp}<div class="av">${L.n[0]}</div><b>${L.n}</b><small>${L.d}</small><div class="tags"><span>${o.t==='a'?tx('act'):tx('pas')}</span><span>${o.cd?'⏱ '+o.cd+tx('s'):'∞'}</span></div>`;
 b.onclick=()=>b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
 b.onpointermove=e=>{const r=b.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;b.style.transform=`perspective(700px) rotateX(${(.5-py)*16}deg) rotateY(${(px-.5)*16}deg)`;b.style.setProperty('--mx',px*100+'%');b.style.setProperty('--my',py*100+'%')};
 b.onpointerleave=()=>{b.style.transform=''};
 sc.appendChild(b)})}
function nearest(){const cs=cards(),m=sc.getBoundingClientRect(),mid=m.left+m.width/2;let b=cs[0],d=1e9;cs.forEach(c=>{const r=c.getBoundingClientRect(),q=Math.abs(r.left+r.width/2-mid);if(q<d){d=q;b=c}});return b}
function hl(){const b=nearest();cards().forEach(c=>c.classList.toggle('on',c===b));return b}
sc.addEventListener('scroll',()=>{if(!$('menu').classList.contains('on'))return;hl();clearTimeout(tm);tm=setTimeout(()=>{const k=hl().dataset.k;if(k!==cur)pick(k)},110)});
function step(d){const cs=cards(),i=cs.indexOf(nearest());cs[(i+d+cs.length)%cs.length].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
$('pl').onclick=()=>step(-1);$('pr').onclick=()=>step(1);
function pick(k){cur=k;const o=CH[k];document.documentElement.style.setProperty('--c',o.c);setName(o[LG].n);$('desc').textContent=o[LG].d;$('abt').textContent=o[LG].ab;$('abf').style.width='0';bgLetters();start(true)}
function applyLang(){document.documentElement.lang=LG;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tx(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=tx(e.dataset.p));
 renderCards();centerCur('instant');setName(CH[cur][LG].n);$('desc').textContent=CH[cur][LG].d;$('abt').textContent=CH[cur][LG].ab;bgLetters();ui()}
// modals
function open(id){$(id).classList.add('show');if(id==='lbm')renderLB('lb1')}
function close(el){el.classList.remove('show')}
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>open(b.dataset.o));
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>close(b.closest('.ov')));
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('pointerdown',e=>{if(e.target===o&&o.id!=='over')close(o)}));
$('s1').value=ms;$('s2').value=gsp;
function sv(){$('v1').textContent=ms;$('v2').textContent='×'+(+gsp).toFixed(1)}sv();
$('s1').oninput=e=>{ms=+e.target.value;LS.s('ms',ms);sv()};$('s2').oninput=e=>{gsp=+e.target.value;LS.s('gs',gsp);sv()};
// leaderboard
let DB=null;
if(window.claude&&claude.use){claude.use('db').then(d=>{DB=d}).catch(()=>{})}
async function getRows(){let r=LS.g('plb',[]);try{if(DB){const q=await DB.collection('scores').orderBy('s','desc').limit(10).get();r=r.concat(q.docs.map(d=>d.data()))}}catch(e){}
 const seen={};return r.filter(x=>x&&x.n&&(seen[x.n+'|'+x.s]?0:seen[x.n+'|'+x.s]=1)).sort((a,b)=>b.s-a.s).slice(0,10)}
async function renderLB(id,me){const t=$(id),rows=await getRows();t.innerHTML='';
 if(!rows.length){t.innerHTML='<tr><td class="empty"></td></tr>';t.querySelector('td').textContent=tx('empty');return}
 rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.style.animationDelay=i*.07+'s';if(me&&r.n===me.n&&r.s===me.s)tr.className='me';
  const a=document.createElement('td');a.dataset.n=i+1;const b=document.createElement('td');b.textContent=r.n+(CH[r.ch]?' · '+CH[r.ch][LG].n:'');const c=document.createElement('td');c.textContent=r.s;tr.append(a,b,c);t.appendChild(tr)})}
let lastScore=0,saved=false;
function showOver(){lastScore=score;saved=false;$('fs').textContent=score;$('nick').value=LS.g('nick','');$('save').disabled=false;$('lb2').innerHTML='';renderLB('lb2');open('over')}
$('save').onclick=async()=>{if(saved)return;const n=($('nick').value.trim()||tx('anon')).slice(0,14);LS.s('nick',n);saved=true;$('save').disabled=true;
 const row={n,s:lastScore,ch:cur,t:Date.now()};const l=LS.g('plb',[]);l.push(row);l.sort((a,b)=>b.s-a.s);LS.s('plb',l.slice(0,10));
 try{if(DB)await DB.collection('scores').add(row)}catch(e){}
 renderLB('lb2',row)};
$('again').onclick=()=>{close($('over'));start(false)};
$('tomenu').onclick=()=>{close($('over'));start(true);view('menu')};
// game
const cv=$('c'),x=cv.getContext('2d'),W=640,H=480;$('best').textContent=best;
let p={x:W/2,y:H-60},tg={x:W/2,y:H-60},items=[],parts=[],bul=[],stars=[],score=0,lives=3,run=false,spawn=0,eff=0,cdT=0,cdM=1,fireT=0,flash=0,last=performance.now(),overT=0;
for(let i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5});
function pos(e){const r=cv.getBoundingClientRect();tg.x=(e.clientX-r.left)*W/r.width;tg.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',pos);cv.addEventListener('pointerdown',pos);
cv.addEventListener('contextmenu',e=>{e.preventDefault();ability()});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();ability()}});
function ui(){$('sc').textContent=score;$('lv').textContent='❤'.repeat(Math.max(lives,0))||'—'}
function start(idle){items=[];parts=[];bul=[];score=0;lives=3;run=!idle;spawn=0;eff=0;cdT=0;overT=0;ui()}
$('play').onclick=()=>{view('game');start(false)};
$('back').onclick=()=>{start(true);view('menu')};$('go').onclick=()=>start(false);
function ability(){const o=CH[cur];if(!run||!o.cd||cdT>0)return;eff=o.dur;cdM=o.after?o.dur+o.cd:o.cd;cdT=cdM;fireT=0;burst(p.x,p.y,o.c,24)}
$('ab').onclick=ability;
function burst(a,b,c,n=10){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:.5,c})}
function heart(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s,cy-s*.2,cx-s*.5,cy-s,cx,cy-s*.4);x.bezierCurveTo(cx+s*.5,cy-s,cx+s,cy-s*.2,cx,cy+s*.35);x.bezierCurveTo(cx+s*.5,cy-s,cx+s,cy-s*.2,cx,cy+s);x.fill()}
function spike(cx,cy,r,a){x.beginPath();for(let i=0;i<16;i++){const q=i*Math.PI/8+a,R=i%2?r*.5:r;x.lineTo(cx+Math.cos(q)*R,cy+Math.sin(q)*R)}x.closePath();x.fill();x.stroke()}
function loop(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 const o=CH[cur],gs=((cur==='igor'&&eff>0)?.35:1)*gsp,T0=now/1000,light=document.documentElement.dataset.theme==='light';
 const k=1-Math.exp(-ms*4*dt);p.x+=(tg.x-p.x)*k;p.y+=(tg.y-p.y)*k;
 x.clearRect(0,0,W,H);
 stars.forEach(s=>{s.y+=s.s*20*dt;if(s.y>H)s.y=0;x.fillStyle=light?'rgba(194,24,91,.45)':'rgba(255,255,255,.45)';x.fillRect(s.x,s.y,s.s,s.s)});
 if(run){
  spawn-=dt*gs;
  if(spawn<=0){spawn=Math.max(.2,.55-score/150);items.push({x:30+Math.random()*(W-60),y:-20,v:210+Math.random()*130+score*4,bad:Math.random()<.5+Math.min(score/200,.15),a:0})}
  if(cur==='alina'&&eff>0){fireT-=dt;if(fireT<=0){fireT=.14;bul.push({x:p.x,y:p.y-24})}}
  bul.forEach(b=>{b.y-=700*dt;items.forEach(i=>{if(i.bad&&!i.dead&&!b.dead&&Math.hypot(i.x-b.x,i.y-b.y)<26){i.dead=1;b.dead=1;burst(i.x,i.y,o.c,12)}})});
  bul=bul.filter(b=>!b.dead&&b.y>-10);
  items.forEach(i=>{if(i.dead)return;i.y+=i.v*dt*gs;i.a+=dt*3*gs;
   if(Math.hypot(i.x-p.x,i.y-p.y)<34){i.dead=1;
    if(i.bad){if(cur==='polina'&&eff>0)burst(i.x,i.y,'#fff',14);else{lives--;flash=.3;burst(i.x,i.y,'#000',14)}}
    else{score++;burst(i.x,i.y,o.c);if(cur==='lena'&&score%20===0&&lives<6){lives++;burst(p.x,p.y,'#ff3d71',24)}}
    ui()}
   else if(i.y>H+30)i.dead=1});
  items=items.filter(i=>!i.dead);
  if(eff>0)eff-=dt;if(cdT>0)cdT-=dt;
  if(lives<=0){run=false;overT=.7;if(score>best){best=score;$('best').textContent=best;LS.s('pbest3',best)}}
 }
 if(overT>0){overT-=dt;if(overT<=0)showOver()}
 items.forEach(i=>{if(i.bad){x.fillStyle='#000';x.strokeStyle=o.c;x.lineWidth=2;spike(i.x,i.y,20,i.a)}else{x.fillStyle=o.c;x.shadowColor=o.c;x.shadowBlur=14;heart(i.x,i.y-8,20);x.shadowBlur=0}});
 x.fillStyle=o.c;x.shadowColor=o.c;x.shadowBlur=10;bul.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));x.shadowBlur=0;
 parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l-=dt;x.globalAlpha=Math.max(q.l*2,0);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()});x.globalAlpha=1;parts=parts.filter(q=>q.l>0);
 const g=x.createRadialGradient(p.x,p.y,4,p.x,p.y,36);g.addColorStop(0,'#fff');g.addColorStop(.4,o.c);g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,36,0,7);x.fill();
 if(cur==='polina'&&eff>0){x.strokeStyle='#fff';x.lineWidth=3;x.globalAlpha=.6+.4*Math.sin(T0*12);x.beginPath();x.arc(p.x,p.y,46,0,7);x.stroke();x.globalAlpha=1}
 if(cur==='igor'&&eff>0){x.strokeStyle=o.c;x.lineWidth=2;for(let j=0;j<3;j++){x.globalAlpha=.5-j*.15;x.beginPath();x.arc(p.x,p.y,44+j*10+Math.sin(T0*6)*3,0,7);x.stroke()}x.globalAlpha=1}
 if(cur==='alina'&&eff>0){x.font='24px sans-serif';x.textAlign='center';x.fillText('🔫',p.x+30,p.y-8)}
 if(flash>0){flash-=dt;x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}
 if(o.cd){$('abf').style.width=(cdT>0?cdT/cdM*100:0)+'%';const a=o[LG].ab;$('abt').textContent=eff>0?a+' · '+eff.toFixed(1)+tx('s'):cdT>0?a+' · '+Math.ceil(cdT)+tx('s'):a+' — '+tx('ready')}else $('abf').style.width='0';
 if(!run&&!overT&&lives<=0){x.fillStyle=light?'#2b0a18':'#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText(tx('end')+score,W/2,H/2)}
 requestAnimationFrame(loop)}
// ===== SECRET: names fly, site breaks, sandbox =====
let sec=null,drag=null;
const SEL='h1 span,.chip,.ver,.soon,.sub,.ib,.btn,.stat,.ch,.ar,canvas,.hint';
function put(i){i.el.style.transform=`translate(${i.x}px,${i.y}px) rotate(${i.rot}rad)`}
function pin(i){const s=i.el.style;s.position='fixed';s.left='0';s.top='0';s.width=i.w+'px';s.height=i.h+'px';s.margin='0';s.zIndex=i.el.classList.contains('fl')?12:9;s.transition='none';s.animation='none';s.scale='1';s.opacity='1';s.cursor='grab';s.touchAction='none';put(i)}
function secret(){if(sec||document.querySelector('.ov.show'))return;
 sec={its:[],t:0,fall:false,last:performance.now()};document.body.classList.add('sec','shake');
 const names=Object.values(CH).map(o=>o[LG].n);
 for(let r=0;r<3;r++)names.forEach(n=>{const el=document.createElement('div');el.className='fl';el.textContent=n;document.body.appendChild(el);
  const w=el.offsetWidth,h=el.offsetHeight,a=Math.random()*6.28,sp=350+Math.random()*350;
  const i={el,w,h,x:Math.random()*(innerWidth-w),y:Math.random()*(innerHeight-h),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:0,vr:(Math.random()-.5)*8,chip:1};sec.its.push(i);pin(i)});
 requestAnimationFrame(secLoop)}
function breakAll(){sec.fall=true;document.body.classList.remove('shake');scrollTo(0,0);document.body.classList.add('broken');
 const els=[...document.querySelectorAll(SEL)].filter(e=>!e.closest('.ov')&&e.id!=='fix'&&e.getClientRects().length);
 const rs=els.map(e=>e.getBoundingClientRect());
 els.forEach((e,n)=>{const r=rs[n];const i={el:e,w:r.width,h:r.height,x:r.left,y:r.top,vx:(Math.random()-.5)*400,vy:-Math.random()*300,rot:0,vr:(Math.random()-.5)*3,old:e.getAttribute('style')};sec.its.push(i);pin(i)})}
function secLoop(now){if(!sec)return;const dt=Math.min((now-sec.last)/1000,.05);sec.last=now;sec.t+=dt;
 if(!sec.fall&&sec.t>3.2)breakAll();
 const Wd=innerWidth,Hd=innerHeight;
 sec.its.forEach(i=>{if(i.drag)return;
  if(sec.fall)i.vy+=1900*dt;
  i.x+=i.vx*dt;i.y+=i.vy*dt;i.rot+=i.vr*dt;
  if(i.x<0){i.x=0;i.vx=Math.abs(i.vx)*.6}if(i.x+i.w>Wd){i.x=Wd-i.w;i.vx=-Math.abs(i.vx)*.6}
  if(i.y<0&&!sec.fall){i.y=0;i.vy=Math.abs(i.vy)}
  if(i.y+i.h>Hd){i.y=Hd-i.h;i.vy=sec.fall?-Math.abs(i.vy)*.4:-Math.abs(i.vy);if(sec.fall){i.vx*=.92;i.vr*=.85;if(Math.abs(i.vy)<40)i.vy=0}}
  put(i)});
 requestAnimationFrame(secLoop)}
function restore(){if(!sec)return;sec.its.forEach(i=>{if(i.chip)i.el.remove();else if(i.old===null)i.el.removeAttribute('style');else i.el.setAttribute('style',i.old)});
 sec=null;drag=null;document.body.classList.remove('sec','shake','broken');scrollTo(0,0);hl();centerCur('instant');setName(CH[cur][LG].n)}
$('fix').onclick=restore;
document.addEventListener('click',e=>{if(sec&&!e.target.closest('#fix')){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{if(!sec||!sec.fall||e.target.closest('#fix'))return;
 const it=[...sec.its].reverse().find(i=>i.el===e.target||i.el.contains(e.target));if(!it)return;e.preventDefault();
 it.drag=true;it.vx=it.vy=0;drag={it,ox:e.clientX-it.x,oy:e.clientY-it.y,lx:e.clientX,ly:e.clientY,vx:0,vy:0,lt:performance.now()};it.el.style.cursor='grabbing';it.el.style.zIndex=15},true);
addEventListener('pointermove',e=>{if(!drag)return;const n=performance.now(),d=Math.max((n-drag.lt)/1000,.001);
 drag.vx=drag.vx*.6+((e.clientX-drag.lx)/d)*.4;drag.vy=drag.vy*.6+((e.clientY-drag.ly)/d)*.4;drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=n;
 drag.it.x=e.clientX-drag.ox;drag.it.y=e.clientY-drag.oy;put(drag.it)});
addEventListener('pointerup',()=>{if(!drag)return;const i=drag.it;i.drag=false;i.vx=Math.max(-2500,Math.min(2500,drag.vx));i.vy=Math.max(-2500,Math.min(2500,drag.vy));i.vr=i.vx/Math.max(i.w,60)*2;i.el.style.cursor='grab';drag=null});
// init
applyLang();pick('polina');requestAnimationFrame(loop);
</script>
</body>
